name: Shadow View Booster Engine

on:
  workflow_dispatch: # ম্যানুয়াল ট্রিগার
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিটে অটোমেটেড সেশন রান

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Isolated Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Inject Core Dependencies
        run: |
          pip install -r requirements.txt
          pip install curl_cffi asyncio aiohttp # TLS স্পুফিং এর জন্য প্রয়োজনীয়

      - name: Execute Targeted Request Vector
        env:
          TARGET_CHANNEL: "IBIIXi" # আপনার চ্যানেল ইউজারনেম (@ ছাড়া)
          TARGET_POST: "12"         # পোস্ট আইডি
        run: |
          # ডিফল্ট auto মুড গিটহাবের Azure IP ব্লক খাবে, তাই হাই-কোয়ালিটি লিস্ট রোটেশন বাধ্যতামুলক
          python main.py --mode auto --channel $TARGET_CHANNEL --post $TARGET_POST --concurrency 150
